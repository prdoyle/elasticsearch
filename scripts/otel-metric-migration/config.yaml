# Paths (e.g. clusters) are relative to this config file's directory.
environments:
  qa:
    clusters: qa-clusters.txt

metrics:
  - old: jvm.memory.heap.used
    new: { name: jvm.memory.used, dimensions: { jvm.memory.type: heap } }
  - old: jvm.memory.heap.committed
    new: { name: jvm.memory.committed, dimensions: { jvm.memory.type: heap } }
  - old: jvm.memory.heap.max
    new: { name: jvm.memory.limit, dimensions: { jvm.memory.type: heap } }
  - old: jvm.memory.non_heap.used
    new: { name: jvm.memory.used, dimensions: { jvm.memory.type: non_heap } }
  - old: jvm.memory.non_heap.committed
    new: { name: jvm.memory.committed, dimensions: { jvm.memory.type: non_heap } }
  - old: jvm.memory.non_heap.max
    new: { name: jvm.memory.limit, dimensions: { jvm.memory.type: non_heap } }
  - old: jvm.memory.heap.pool.used
    new: { name: jvm.memory.used, dimensions: { jvm.memory.type: heap } }
  - old: jvm.memory.heap.pool.committed
    new: { name: jvm.memory.committed, dimensions: { jvm.memory.type: heap } }
  - old: jvm.memory.heap.pool.max
    new: { name: jvm.memory.limit, dimensions: { jvm.memory.type: heap } }
  - old: jvm.gc.count
    new: { name: "TODO: derive event count from process.runtime.jvm.gc.duration histogram", dimensions: {} }
  - old: jvm.gc.time
    new: { name: "TODO: derive total time from process.runtime.jvm.gc.duration histogram sum", dimensions: {} }
  - old: jvm.gc.alloc
    new: { name: "TODO: no standard OTel metric; use custom/JMX or process.runtime.jvm.memory.usage for heap growth", dimensions: {} }
  - old: jvm.thread.count
    new: { name: process.runtime.jvm.threads.count, dimensions: {} }
  - old: jvm.classes.loaded
    new: { name: process.runtime.jvm.classes.current_loaded, dimensions: {} }
  - old: system.fd.open
    new: { name: process.open_file_descriptor.count, dimensions: {} }
  - old: system.fd.max
    new: { name: "TODO: process.open_file_descriptor.limit not yet in OTel spec; use platform/JMX until standardized", dimensions: {} }
  - old: system.cpu.total.norm.pct
    new: { name: process.runtime.jvm.system.cpu.utilization, dimensions: {} }
  - old: system.process.cpu.total.norm.pct
    new: { name: process.runtime.jvm.cpu.utilization, dimensions: {} }
  - old: system.memory.total
    new: { name: system.memory.limit, dimensions: {} }
  - old: system.memory.free
    new: { name: system.memory.usage, dimensions: { state: free } }
